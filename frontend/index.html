<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
      <div class="container">
        <span class="navbar-brand mb-0 h1"> Expense Tracker</span>
      </div>
    </nav>

    <main class="container pb-5">
      <div id="alert-box"></div>

      <div id="spinner" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Summary cards -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted">Total amount</div>
              <div class="fs-3 fw-bold" id="sum-total">0.00</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted">Number of expenses</div>
              <div class="fs-3 fw-bold" id="sum-count">0</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted">Highest expense</div>
              <div class="fs-3 fw-bold" id="sum-max">-</div>
              <small class="text-muted" id="sum-max-title">&nbsp;</small>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">Add expense</div>
        <div class="card-body">
          <form id="add-form" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label" for="add-title">Title</label>
                <input type="text" class="form-control" id="add-title" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="add-amount">Amount</label>
                <input
                  type="number"
                  step="0.01"
                  class="form-control"
                  id="add-amount"
                />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="add-category">Category</label>
                <select class="form-select" id="add-category"></select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="add-date">Date</label>
                <input type="date" class="form-control" id="add-date" />
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3 w-100">
              Add expense
            </button>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div
          class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center"
        >
          <span class="fw-bold">Expenses</span>
          <select
            class="form-select w-auto"
            id="filter-category"
            aria-label="Filter by category"
          >
            <option value="All">All</option>
          </select>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal fade" id="edit-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="edit-form" novalidate>
            <div class="modal-header">
              <h5 class="modal-title">Edit expense</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="edit-id" />
              <div class="mb-3">
                <label class="form-label" for="edit-title">Title</label>
                <input type="text" class="form-control" id="edit-title" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="edit-amount">Amount</label>
                <input
                  type="number"
                  step="0.01"
                  class="form-control"
                  id="edit-amount"
                />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="edit-category">Category</label>
                <select class="form-select" id="edit-category"></select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="edit-date">Date</label>
                <input type="date" class="form-control" id="edit-date" />
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/app.js"></script>
  </body>
</html>
